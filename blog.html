<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - BPO Hive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Navigation -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold text-blue-600">BPO Hive</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 hover:text-gray-900">Home</a>
                    <a href="blog.html" class="text-blue-600 font-medium">Blog</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">

        <!-- Post Detail View -->
        <div id="post-detail" class="hidden">
            <button onclick="showList()" class="mb-6 text-blue-600 hover:text-blue-800 flex items-center">
                &larr; Back to Blog
            </button>
            <article class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img id="detail-image" class="w-full h-64 object-cover hidden" src="" alt="Post Image">
                <div class="p-8">
                    <h1 id="detail-title" class="text-3xl font-bold text-gray-900 mb-4"></h1>
                    <p id="detail-date" class="text-gray-500 text-sm mb-6"></p>
                    <div id="detail-content" class="prose max-w-none text-gray-700"></div>
                </div>
            </article>
        </div>

        <!-- Blog List View -->
        <div id="blog-list">
            <h1 class="text-4xl font-bold text-gray-900 mb-8 text-center">Latest News & Insights</h1>
            <div id="posts-container" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
                <!-- Posts will be injected here -->
            </div>
            <div id="loading" class="text-center text-gray-500 py-12">Loading posts...</div>
            <div id="no-posts" class="hidden text-center text-gray-500 py-12">No posts found.</div>
        </div>

    </main>

    <script>
        const API_URL = 'http://localhost:3001/api';

        // Check URL params
        const urlParams = new URLSearchParams(window.location.search);
        const postSlug = urlParams.get('slug');

        if (postSlug) {
            fetchPost(postSlug);
        } else {
            fetchPosts();
        }

        function showList() {
            document.getElementById('post-detail').classList.add('hidden');
            document.getElementById('blog-list').classList.remove('hidden');
            // Update URL without reloading
            const url = new URL(window.location);
            url.searchParams.delete('slug');
            window.history.pushState({}, '', url);
        }

        async function fetchPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`);
                const posts = await res.json();

                document.getElementById('loading').classList.add('hidden');

                if (posts.length === 0) {
                    document.getElementById('no-posts').classList.remove('hidden');
                    return;
                }

                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                posts.forEach(post => {
                    // Create excerpt from content (strip HTML)
                    const tmp = document.createElement('DIV');
                    tmp.innerHTML = post.content;
                    const text = tmp.textContent || tmp.innerText || "";
                    const excerpt = text.substring(0, 150) + '...';

                    const date = new Date(post.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });

                    const imgTag = post.image_url
                        ? `<img class="h-48 w-full object-cover" src="http://localhost:3001${post.image_url}" alt="${post.title}">`
                        : `<div class="h-48 w-full bg-gray-200 flex items-center justify-center text-gray-400">No Image</div>`;

                    const html = `
                        <div class="flex flex-col rounded-lg shadow-lg overflow-hidden cursor-pointer hover:shadow-xl transition-shadow duration-300 bg-white" 
                             onclick="viewPost('${post.slug}')">
                            <div class="flex-shrink-0">
                                ${imgTag}
                            </div>
                            <div class="flex-1 bg-white p-6 flex flex-col justify-between">
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-blue-600">Article</p>
                                    <h3 class="mt-2 text-xl font-semibold text-gray-900">${post.title}</h3>
                                    <p class="mt-3 text-base text-gray-500">${excerpt}</p>
                                </div>
                                <div class="mt-6 flex items-center">
                                    <div class="flex-shrink-0">
                                        <p class="text-sm text-gray-500">${date}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'Error loading posts.';
            }
        }

        async function fetchPost(slug) {
            try {
                document.getElementById('blog-list').classList.add('hidden');
                document.getElementById('post-detail').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');

                const res = await fetch(`${API_URL}/posts/${slug}`);
                if (!res.ok) throw new Error('Post not found');

                const post = await res.json();

                // Update URL
                const url = new URL(window.location);
                url.searchParams.set('slug', slug);
                window.history.pushState({}, '', url);

                // Populate Detail View
                document.getElementById('detail-title').innerText = post.title;
                document.getElementById('detail-date').innerText = new Date(post.created_at).toLocaleDateString(undefined, {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                document.getElementById('detail-content').innerHTML = post.content;

                const img = document.getElementById('detail-image');
                if (post.image_url) {
                    img.src = `http://localhost:3001${post.image_url}`;
                    img.classList.remove('hidden');
                } else {
                    img.classList.add('hidden');
                }

            } catch (err) {
                console.error(err);
                document.getElementById('blog-list').classList.remove('hidden');
                document.getElementById('post-detail').classList.add('hidden');
                alert('Post not found.');
            }
        }

        window.viewPost = (slug) => {
            fetchPost(slug);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
