<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPO Hive Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">

    <div id="login-container" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"
                        required>
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Sign In
                </button>
                <p id="login-error" class="text-red-500 text-sm hidden"></p>
            </form>
        </div>
    </div>

    <div id="dashboard-container" class="hidden">
        <nav class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">BPO Hive CMS</h1>
                        <div class="ml-10 flex items-baseline space-x-4">
                            <button onclick="switchTab('pages')" id="tab-pages"
                                class="bg-gray-900 text-white px-3 py-2 rounded-md text-sm font-medium">Pages</button>
                            <button onclick="switchTab('blog')" id="tab-blog"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Blog</button>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <button id="logout-btn" class="text-gray-600 hover:text-gray-900">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">

            <!-- Notification -->
            <div id="notification"
                class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded shadow-lg z-50">Saved
                successfully!</div>

            <!-- PAGES TAB -->
            <div id="view-pages" class="px-4 py-6 sm:px-0">
                <div class="bg-white shadow overflow-hidden sm:rounded-lg p-6">
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Page Content Manager</h2>
                    <div class="mb-6">
                        <h3 class="text-md font-medium text-gray-700 mb-2">Edit Content</h3>
                        <form id="content-form" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Key (ID)</label>
                                <input type="text" id="content-key"
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"
                                    placeholder="e.g., hero-title" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Type</label>
                                <select id="content-type"
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                    <option value="text">Text</option>
                                    <option value="image">Image</option>
                                </select>
                            </div>
                            <div id="text-input-container">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Value</label>
                                <div id="quill-editor-pages" class="h-64 bg-white border border-gray-300 rounded-md">
                                </div>
                            </div>
                            <div id="image-input-container" class="hidden">
                                <label class="block text-sm font-medium text-gray-700">Upload Image</label>
                                <input type="file" id="image-file"
                                    class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                <input type="hidden" id="image-url">
                                <div id="image-preview" class="mt-2 hidden">
                                    <img src="" alt="Preview" class="h-32 w-auto rounded border">
                                </div>
                            </div>
                            <button type="submit"
                                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700">Save
                                Content</button>
                        </form>
                    </div>
                    <div class="border-t border-gray-200 pt-6">
                        <h3 class="text-md font-medium text-gray-700 mb-4">Existing Content</h3>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th
                                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Key</th>
                                        <th
                                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Type</th>
                                        <th
                                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Value</th>
                                        <th
                                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="content-list" class="bg-white divide-y divide-gray-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BLOG TAB -->
            <div id="view-blog" class="hidden px-4 py-6 sm:px-0">
                <div class="bg-white shadow overflow-hidden sm:rounded-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-medium text-gray-900">Blog Posts</h2>
                        <button onclick="openPostModal()"
                            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">New Post</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Title</th>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Date</th>
                                    <th
                                        class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Actions</th>
                                </tr>
                            </thead>
                            <tbody id="posts-list" class="bg-white divide-y divide-gray-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- POST MODAL -->
    <div id="post-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-900" id="modal-title">New Post</h3>
                <button onclick="closePostModal()" class="text-gray-500 hover:text-gray-700">&times;</button>
            </div>
            <form id="post-form" class="space-y-4">
                <input type="hidden" id="post-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="post-title"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Featured Image</label>
                    <input type="file" id="post-image"
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <input type="hidden" id="post-image-url">
                    <img id="post-image-preview" src="" class="hidden mt-2 h-32 w-auto object-cover rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Content</label>
                    <div id="quill-editor-posts" class="h-64 bg-white border border-gray-300 rounded-md"></div>
                </div>
                <div class="flex justify-end pt-4">
                    <button type="button" onclick="closePostModal()"
                        class="mr-2 px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Save
                        Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const API_URL = 'http://localhost:3001/api';
        let token = localStorage.getItem('token');
        let currentContent = {};
        let currentPosts = [];

        // Initialize Quill Editors
        const quillModules = {
            toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                ['link', 'image', 'clean']
            ]
        };

        var quillPages = new Quill('#quill-editor-pages', { theme: 'snow', modules: quillModules });
        var quillPosts = new Quill('#quill-editor-posts', { theme: 'snow', modules: quillModules });

        // Elements
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const contentForm = document.getElementById('content-form');
        const postForm = document.getElementById('post-form');
        const logoutBtn = document.getElementById('logout-btn');
        const contentTypeSelect = document.getElementById('content-type');

        // Initialization
        if (token) {
            showDashboard();
        }

        // --- AUTH ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    showDashboard();
                } else {
                    document.getElementById('login-error').innerText = data.error;
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            token = null;
            loginContainer.classList.remove('hidden');
            dashboardContainer.classList.add('hidden');
        });

        // --- TABS ---
        window.switchTab = (tab) => {
            const pagesBtn = document.getElementById('tab-pages');
            const blogBtn = document.getElementById('tab-blog');
            const pagesView = document.getElementById('view-pages');
            const blogView = document.getElementById('view-blog');

            if (tab === 'pages') {
                pagesView.classList.remove('hidden');
                blogView.classList.add('hidden');
                pagesBtn.classList.add('bg-gray-900', 'text-white');
                pagesBtn.classList.remove('text-gray-300', 'hover:bg-gray-700');
                blogBtn.classList.remove('bg-gray-900', 'text-white');
                blogBtn.classList.add('text-gray-300', 'hover:bg-gray-700');
                fetchContent();
            } else {
                pagesView.classList.add('hidden');
                blogView.classList.remove('hidden');
                blogBtn.classList.add('bg-gray-900', 'text-white');
                blogBtn.classList.remove('text-gray-300', 'hover:bg-gray-700');
                pagesBtn.classList.remove('bg-gray-900', 'text-white');
                pagesBtn.classList.add('text-gray-300', 'hover:bg-gray-700');
                fetchPosts();
            }
        };

        function showDashboard() {
            loginContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
            switchTab('pages'); // Default tab
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.classList.remove('hidden');
            setTimeout(() => notif.classList.add('hidden'), 3000);
        }

        // --- PAGES LOGIC ---
        contentTypeSelect.addEventListener('change', (e) => {
            const textContainer = document.getElementById('text-input-container');
            const imageContainer = document.getElementById('image-input-container');
            if (e.target.value === 'image') {
                textContainer.classList.add('hidden');
                imageContainer.classList.remove('hidden');
            } else {
                textContainer.classList.remove('hidden');
                imageContainer.classList.add('hidden');
            }
        });

        async function fetchContent() {
            try {
                const res = await fetch(`${API_URL}/content`);
                const data = await res.json();
                currentContent = data;
                const tbody = document.getElementById('content-list');
                tbody.innerHTML = '';
                Object.values(data).forEach(item => {
                    const tr = document.createElement('tr');
                    let valueDisplay = item.value;
                    if (item.type === 'image') {
                        valueDisplay = `<img src="http://localhost:3001${item.value}" class="h-10 w-10 object-cover">`;
                    } else {
                        const tmp = document.createElement('DIV');
                        tmp.innerHTML = item.value;
                        valueDisplay = (tmp.textContent || tmp.innerText || "").substring(0, 50) + '...';
                    }
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.key}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.type}</td>
                        <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate">${valueDisplay}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="editContent('${item.key}')" class="text-indigo-600 hover:text-indigo-900">Edit</button>
                        </td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        window.editContent = (key) => {
            const item = currentContent[key];
            if (!item) return;
            document.getElementById('content-key').value = item.key;
            document.getElementById('content-type').value = item.type;
            if (item.type === 'image') {
                contentTypeSelect.dispatchEvent(new Event('change'));
                document.getElementById('image-url').value = item.value;
                const preview = document.getElementById('image-preview');
                preview.classList.remove('hidden');
                preview.querySelector('img').src = 'http://localhost:3001' + item.value;
            } else {
                contentTypeSelect.dispatchEvent(new Event('change'));
                quillPages.root.innerHTML = item.value;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        contentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('content-key').value;
            const type = document.getElementById('content-type').value;
            let value = '';

            try {
                if (type === 'image') {
                    const fileInput = document.getElementById('image-file');
                    if (fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('image', fileInput.files[0]);
                        const upRes = await fetch(`${API_URL}/content/upload`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` },
                            body: formData
                        });
                        if (!upRes.ok) throw new Error('Upload failed');
                        value = (await upRes.json()).url;
                    } else {
                        value = document.getElementById('image-url').value;
                        if (!value && currentContent[key]) value = currentContent[key].value;
                        if (!value) return alert('Please upload an image');
                    }
                } else {
                    value = quillPages.root.innerHTML;
                }

                const res = await fetch(`${API_URL}/content`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ key, value, type })
                });

                if (res.ok) {
                    showNotification('Content saved!');
                    fetchContent();
                    contentForm.reset();
                    quillPages.setText('');
                    document.getElementById('image-preview').classList.add('hidden');
                    contentTypeSelect.value = 'text';
                    contentTypeSelect.dispatchEvent(new Event('change'));
                } else {
                    alert('Error: ' + (await res.json()).error);
                }
            } catch (err) { console.error(err); alert('Error saving content'); }
        });


        // --- BLOG LOGIC ---
        async function fetchPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`);
                const posts = await res.json();
                currentPosts = posts;
                const tbody = document.getElementById('posts-list');
                tbody.innerHTML = '';
                posts.forEach(post => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${post.title}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(post.created_at).toLocaleDateString()}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="editPost(${post.id})" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</button>
                            <button onclick="deletePost(${post.id})" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        window.openPostModal = (id = null) => {
            const modal = document.getElementById('post-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('post-form');
            const preview = document.getElementById('post-image-preview');

            modal.classList.remove('hidden');
            form.reset();
            quillPosts.setText('');
            preview.classList.add('hidden');
            preview.src = '';
            document.getElementById('post-image-url').value = '';

            if (id) {
                const post = currentPosts.find(p => p.id === id);
                if (post) {
                    title.textContent = 'Edit Post';
                    document.getElementById('post-id').value = post.id;
                    document.getElementById('post-title').value = post.title;
                    quillPosts.root.innerHTML = post.content;
                    if (post.image_url) {
                        document.getElementById('post-image-url').value = post.image_url;
                        preview.src = 'http://localhost:3001' + post.image_url;
                        preview.classList.remove('hidden');
                    }
                }
            } else {
                title.textContent = 'New Post';
                document.getElementById('post-id').value = '';
            }
        };

        window.closePostModal = () => {
            document.getElementById('post-modal').classList.add('hidden');
        };

        window.editPost = (id) => openPostModal(id);

        window.deletePost = async (id) => {
            if (!confirm('Are you sure?')) return;
            try {
                const res = await fetch(`${API_URL}/posts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showNotification('Post deleted');
                    fetchPosts();
                } else {
                    alert('Error deleting post');
                }
            } catch (err) { console.error(err); }
        };

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            const content = quillPosts.root.innerHTML;
            const fileInput = document.getElementById('post-image');

            const formData = new FormData();
            formData.append('title', title);
            formData.append('content', content);
            if (fileInput.files.length > 0) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/posts/${id}` : `${API_URL}/posts`;

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData // allow browser to set Content-Type for FormData
                });

                if (res.ok) {
                    showNotification('Post saved!');
                    closePostModal();
                    fetchPosts();
                } else {
                    alert('Error saving post: ' + (await res.json()).error);
                }
            } catch (err) { console.error(err); alert('Error saving post'); }
        });

    </script>
</body>

</html>
